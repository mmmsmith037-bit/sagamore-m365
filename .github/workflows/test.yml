name: tests
on:
  push:
  pull_request:
jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline test suite
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1 -CI
